[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ridesharehub-optimizer"
version = "0.0.1"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi[standard]>=0.124,<0.125"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/optimizer"]
