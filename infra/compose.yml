services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ridesharehub
      POSTGRES_USER: ridesharehub
      POSTGRES_PASSWORD: ridesharehub_local
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridesharehub -d ridesharehub"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ridesharehub_postgres:/var/lib/postgresql/data

  optimizer:
    build: ../optimizer
    ports:
      - "${OPTIMIZER_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ../backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ridesharehub
      DB_USERNAME: ridesharehub
      DB_PASSWORD: ridesharehub_local
      JWT_SECRET: ${JWT_SECRET:-dev_insecure_jwt_secret_key_needs_to_be_at_least_64_bytes_long_for_hs512}
      JWT_ACCESS_TOKEN_SECONDS: ${JWT_ACCESS_TOKEN_SECONDS:-900}
      JWT_REFRESH_TOKEN_SECONDS: ${JWT_REFRESH_TOKEN_SECONDS:-604800}
      OPTIMIZER_BASE_URL: ${OPTIMIZER_BASE_URL:-http://optimizer:8000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:8080/actuator/health || bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8080'",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      optimizer:
        condition: service_healthy

  web:
    build: ../web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ridesharehub_postgres:
