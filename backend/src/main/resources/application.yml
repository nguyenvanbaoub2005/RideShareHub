spring:
  application:
    name: ridesharehub-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ridesharehub}
    username: ${DB_USERNAME:ridesharehub}
    password: ${DB_PASSWORD:ridesharehub_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
jwt:
  signer-key: ${JWT_SECRET}
  access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
  refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:604800}
booking:
  policy:
    auto-confirm: ${BOOKING_AUTO_CONFIRM:true}
    book-cutoff-minutes: ${BOOKING_BOOK_CUTOFF_MINUTES:15}
    cancel-cutoff-minutes: ${BOOKING_CANCEL_CUTOFF_MINUTES:30}
server:
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health,info
