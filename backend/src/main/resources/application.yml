spring:
  application:
    name: ridesharehub-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ridesharehub}
    username: ${DB_USERNAME:ridesharehub}
    password: ${DB_PASSWORD:ridesharehub_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
