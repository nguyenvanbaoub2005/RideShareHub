<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RideShareHub Journey Prototype</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="app"><aside><a class="brand" href="#">RideShare<span>Hub</span></a><p class="hint">Journey prototype</p><nav aria-label="Vai trò review"><button data-role="admin" class="active">Admin</button><button data-role="company">Nhà xe</button><button data-role="passenger">Hành khách</button><button data-role="driver">Tài xế</button></nav><div class="notice"><b>Prototype convention</b><p>Chuyển vai trò chỉ để review luồng, không phải tính năng production.</p></div></aside><main><header><div><p class="eyebrow" id="role-label">Admin</p><h1 id="page-title">Duyệt đăng ký nhà xe</h1></div><div class="status"><span class="dot"></span><span id="journey-status">Demo data · reset khi reload</span></div></header><div id="message" class="message" role="status" aria-live="polite" hidden></div><section id="content" tabindex="-1"></section></main></div><dialog id="booking-dialog"><form method="dialog" id="booking-form"><button class="close" type="button" id="close-dialog" aria-label="Đóng">×</button><p class="eyebrow">Đặt chỗ</p><h2 id="booking-title">Chuyến đã chọn</h2><label>Số ghế<input id="seats" name="seats" type="number" min="1" required value="1"></label><label>Điểm đón<input name="pickup" required value="Hải Châu, Đà Nẵng"></label><label>Điểm trả<input name="dropoff" required value="Trung tâm Huế"></label><p id="booking-error" class="error" role="alert"></p><button class="primary" value="default">Xác nhận yêu cầu</button><p class="hint">Chính sách xác nhận booking đang là open decision.</p></form></dialog><script src="mock-data.js"></script><script src="app.js"></script></body></html>
